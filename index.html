<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Navimod Portfolio Optimizer</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: { 900: '#0a0f1a', 800: '#111827', 700: '#1e293b', 600: '#334155' }
                    }
                }
            }
        }
    </script>

    <style>
        * { box-sizing: border-box; }
        body { 
            background: linear-gradient(135deg, #0a0f1a 0%, #111827 50%, #0f172a 100%);
            color: #f1f5f9; 
            font-family: 'Inter', -apple-system, sans-serif; 
            min-height: 100vh;
        }
        
        .glass { 
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.6) 100%);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        
        .glass-card {
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.4) 0%, rgba(15, 23, 42, 0.5) 100%);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(148, 163, 184, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .glass-card:hover {
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.1);
            transform: translateY(-2px);
        }
        
        .gradient-text { 
            background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 50%, #06b6d4 100%);
            background-size: 200% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            animation: gradient 3s ease infinite;
        }
        
        @keyframes gradient {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 100% center; }
        }
        
        .text-glow { text-shadow: 0 0 40px rgba(6, 182, 212, 0.4), 0 0 80px rgba(6, 182, 212, 0.2); }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { 
            -webkit-appearance: none; height: 22px; width: 22px; border-radius: 50%; 
            background: linear-gradient(135deg, #06b6d4, #0891b2);
            cursor: pointer; margin-top: -9px; border: 3px solid #f1f5f9;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.6), 0 4px 12px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track { 
            width: 100%; height: 4px; 
            background: linear-gradient(90deg, #1e293b 0%, #334155 100%);
            border-radius: 4px;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30, 41, 59, 0.3); border-radius: 3px; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
        
        /* Pulse */
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; box-shadow: 0 0 8px currentColor; }
            50% { opacity: 0.6; box-shadow: 0 0 16px currentColor; }
        }
        .pulse-dot { animation: pulse-glow 2s ease-in-out infinite; }
        
        /* Ambient */
        .ambient-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .ambient-bg::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 70% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 40%);
        }
        
        /* Button Group Animation */
        .param-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .param-btn:hover { transform: translateY(-1px); }
        .param-btn.active { transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="ambient-bg"></div>
    <div id="root" class="relative z-10"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const ASSET_COLORS = {
            // Core Equities
            "SPY": { bg: "from-blue-500 to-blue-600", dot: "bg-blue-500", hex: "#3b82f6" },
            "QQQ": { bg: "from-indigo-500 to-indigo-600", dot: "bg-indigo-500", hex: "#6366f1" },
            "IWM": { bg: "from-violet-500 to-violet-600", dot: "bg-violet-500", hex: "#8b5cf6" },
            "VGK": { bg: "from-cyan-500 to-cyan-600", dot: "bg-cyan-500", hex: "#06b6d4" },
            "EEM": { bg: "from-sky-500 to-sky-600", dot: "bg-sky-500", hex: "#0ea5e9" },
            // Sector & Thematic
            "SMH": { bg: "from-fuchsia-500 to-fuchsia-600", dot: "bg-fuchsia-500", hex: "#d946ef" },
            "XLE": { bg: "from-red-500 to-red-600", dot: "bg-red-500", hex: "#ef4444" },
            // Fixed Income
            "TLT": { bg: "from-emerald-500 to-emerald-600", dot: "bg-emerald-500", hex: "#10b981" },
            "LQD": { bg: "from-teal-500 to-teal-600", dot: "bg-teal-500", hex: "#14b8a6" },
            "HYG": { bg: "from-green-500 to-green-600", dot: "bg-green-500", hex: "#22c55e" },
            // Cash / Defensive
            "SHV": { bg: "from-slate-400 to-slate-500", dot: "bg-slate-400", hex: "#94a3b8" },
            // Commodities
            "GLD": { bg: "from-amber-500 to-amber-600", dot: "bg-amber-500", hex: "#f59e0b" },
            "SLV": { bg: "from-zinc-400 to-zinc-500", dot: "bg-zinc-400", hex: "#a1a1aa" },
            "USO": { bg: "from-orange-500 to-orange-600", dot: "bg-orange-500", hex: "#f97316" },
            "COPX": { bg: "from-orange-600 to-orange-700", dot: "bg-orange-600", hex: "#ea580c" },
            "URA": { bg: "from-lime-500 to-lime-600", dot: "bg-lime-500", hex: "#84cc16" },
            "DBA": { bg: "from-yellow-500 to-yellow-600", dot: "bg-yellow-500", hex: "#eab308" },
            // Alternatives
            "VNQ": { bg: "from-rose-500 to-rose-600", dot: "bg-rose-500", hex: "#f43f5e" },
            "IBIT": { bg: "from-orange-400 to-amber-500", dot: "bg-orange-400", hex: "#fb923c" },
            "ETHA": { bg: "from-purple-500 to-purple-600", dot: "bg-purple-500", hex: "#a855f7" }
        };

        const ASSET_NAMES = {
            // Core Equities
            "SPY": "S&P 500", "QQQ": "Nasdaq-100", "IWM": "Russell 2000",
            "VGK": "Europe", "EEM": "Emerging Markets",
            // Sector & Thematic
            "SMH": "Semiconductors", "XLE": "Energy Sector",
            // Fixed Income
            "TLT": "Treasury 20Y+", "LQD": "Corp Bonds IG", "HYG": "High Yield Bonds",
            // Cash
            "SHV": "Short Treasury",
            // Commodities
            "GLD": "Gold", "SLV": "Silver", "USO": "Oil", 
            "COPX": "Copper Miners", "URA": "Uranium", "DBA": "Agriculture",
            // Alternatives
            "VNQ": "Real Estate", "IBIT": "Bitcoin ETF", "ETHA": "Ethereum ETF"
        };

        // --- BACKTEST CHART ---
        const BacktestChart = ({ chartData, benchmarkData, dates, historyWeights }) => {
            const canvasRef = useRef(null);
            const chartInstance = useRef(null);

            const externalTooltipHandler = (context) => {
                let tooltipEl = document.getElementById('chartjs-tooltip');
                if (!tooltipEl) {
                    tooltipEl = document.createElement('div');
                    tooltipEl.id = 'chartjs-tooltip';
                    Object.assign(tooltipEl.style, { opacity: '0', pointerEvents: 'none', position: 'absolute', zIndex: '100', transition: 'all 0.15s ease' });
                    tooltipEl.className = "bg-slate-900/95 backdrop-blur-xl border border-slate-600/50 rounded-2xl p-5 shadow-2xl text-xs min-w-[240px]";
                    document.body.appendChild(tooltipEl);
                }
                
                const tooltipModel = context.tooltip;
                if (tooltipModel.opacity === 0) { tooltipEl.style.opacity = '0'; return; }

                if (tooltipModel.body) {
                    const dataIndex = tooltipModel.dataPoints[0].dataIndex;
                    const date = dates[dataIndex];
                    const portVal = chartData[dataIndex]?.toFixed(2) || '-';
                    const benchVal = benchmarkData[dataIndex]?.toFixed(2) || '-';
                    let currentAlloc = historyWeights?.[dataIndex] || [];

                    let allocHtml = '';
                    currentAlloc.filter(a => a.w > 0).slice(0, 5).forEach(asset => {
                        const color = ASSET_COLORS[asset.t]?.hex || '#64748b';
                        allocHtml += `<div class="flex items-center justify-between py-1">
                            <div class="flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full" style="background:${color}"></div>
                                <span class="text-slate-300 font-medium">${asset.t}</span>
                            </div>
                            <span class="font-mono text-cyan-400 font-semibold">${asset.w.toFixed(1)}%</span>
                        </div>`;
                    });

                    tooltipEl.innerHTML = `
                        <div class="border-b border-slate-700/50 pb-3 mb-3">
                            <div class="text-slate-500 font-mono text-[10px] mb-2">${date}</div>
                            <div class="grid grid-cols-2 gap-4">
                                <div><div class="text-[9px] uppercase font-bold text-cyan-400 mb-0.5">Portfolio</div><div class="text-xl font-bold text-white font-mono">${portVal}</div></div>
                                <div class="text-right"><div class="text-[9px] uppercase font-bold text-slate-500 mb-0.5">S&P 500</div><div class="text-xl font-bold text-slate-400 font-mono">${benchVal}</div></div>
                            </div>
                        </div>
                        <div><div class="text-[9px] text-slate-500 uppercase font-bold mb-2 tracking-wider">Allocation</div>${allocHtml || '<div class="text-slate-600 italic">No data</div>'}</div>
                    `;
                }
                
                const position = context.chart.canvas.getBoundingClientRect();
                let left = position.left + window.pageXOffset + tooltipModel.caretX + 15;
                let top = position.top + window.pageYOffset + tooltipModel.caretY - 30;
                if (left + 260 > window.innerWidth) left = left - 280;
                tooltipEl.style.opacity = '1';
                tooltipEl.style.left = left + 'px';
                tooltipEl.style.top = top + 'px';
            };

            useEffect(() => {
                if (!canvasRef.current || !chartData || !benchmarkData) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartInstance.current) chartInstance.current.destroy();

                const gradient = ctx.createLinearGradient(0, 0, 0, 350);
                gradient.addColorStop(0, 'rgba(6, 182, 212, 0.25)');
                gradient.addColorStop(0.5, 'rgba(6, 182, 212, 0.08)');
                gradient.addColorStop(1, 'rgba(6, 182, 212, 0)');

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            { label: 'Portfolio', data: chartData, borderColor: '#06b6d4', backgroundColor: gradient, borderWidth: 2.5, fill: true, pointRadius: 0, pointHoverRadius: 6, pointHoverBackgroundColor: '#06b6d4', pointHoverBorderColor: '#fff', pointHoverBorderWidth: 2, tension: 0.1 },
                            { label: 'S&P 500', data: benchmarkData, borderColor: 'rgba(148, 163, 184, 0.6)', borderWidth: 2, borderDash: [6, 4], pointRadius: 0, tension: 0.1, fill: false }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: { legend: { display: false }, tooltip: { enabled: false, external: externalTooltipHandler } },
                        scales: { 
                            x: { display: true, grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 }, maxTicksLimit: 8,
                                callback: function(val) { const date = this.getLabelForValue(val); if (date && typeof date === 'string') { const parts = date.split('-'); if (parts.length >= 2) return `${parts[1]}/${parts[0].slice(2)}`; } return date; }
                            }, title: { display: true, text: 'DATE', color: '#475569', font: { size: 10, weight: '600' }, padding: { top: 10 } } }, 
                            y: { grid: { color: 'rgba(148, 163, 184, 0.06)' }, ticks: { color: '#64748b', font: { size: 10 } }, title: { display: true, text: 'VALUE', color: '#475569', font: { size: 10, weight: '600' } } } 
                        }
                    }
                });
                return () => { if(chartInstance.current) chartInstance.current.destroy(); };
            }, [chartData, benchmarkData, historyWeights, dates]);

            return <canvas ref={canvasRef} />;
        };

        // --- FRONTIER CHART ---
        const FrontierChart = ({ points, activeIdx }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            
            useEffect(() => {
                if (!chartRef.current || !points || points.length === 0) return;
                const ctx = chartRef.current.getContext('2d');
                const scatterData = points.map(p => ({ x: p.vol, y: p.ret }));
                let targetIdx = Math.floor(((activeIdx - 1) / 4) * (points.length - 1));
                targetIdx = Math.min(Math.max(0, targetIdx), points.length - 1);
                const selectedPoint = scatterData[targetIdx];

                if (chartInstance.current) chartInstance.current.destroy();

                const gradientLine = ctx.createLinearGradient(0, 0, ctx.canvas.width, 0);
                gradientLine.addColorStop(0, 'rgba(16, 185, 129, 0.8)');
                gradientLine.addColorStop(0.5, 'rgba(6, 182, 212, 0.8)');
                gradientLine.addColorStop(1, 'rgba(139, 92, 246, 0.8)');
                
                chartInstance.current = new Chart(ctx, {
                    type: 'scatter',
                    data: {
                        datasets: [
                            { label: 'Frontier', data: scatterData, borderColor: gradientLine, borderWidth: 3, showLine: true, backgroundColor: 'transparent', pointRadius: 0, tension: 0.4 },
                            { label: 'Selected', data: selectedPoint ? [selectedPoint] : [], backgroundColor: '#06b6d4', borderColor: '#ffffff', borderWidth: 3, pointRadius: 12, pointHoverRadius: 15 }
                        ]
                    },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false }, tooltip: { enabled: true, backgroundColor: 'rgba(15, 23, 42, 0.95)', borderColor: 'rgba(71, 85, 105, 0.5)', borderWidth: 1, padding: 12, displayColors: false,
                            callbacks: { label: (ctx) => ctx.datasetIndex === 1 ? [`Return: ${ctx.parsed.y.toFixed(1)}%`, `Volatility: ${ctx.parsed.x.toFixed(1)}%`] : '' }
                        }},
                        scales: { 
                            x: { title: { display: true, text: 'VOLATILITY (%)', color: '#64748b', font: { size: 11, weight: '600' } }, grid: { color: 'rgba(148, 163, 184, 0.06)' }, ticks: { color: '#64748b', font: { size: 10 } } }, 
                            y: { title: { display: true, text: 'RETURN (%)', color: '#64748b', font: { size: 11, weight: '600' } }, grid: { color: 'rgba(148, 163, 184, 0.06)' }, ticks: { color: '#64748b', font: { size: 10 } } } 
                        },
                        animation: { duration: 400, easing: 'easeOutQuart' }
                    }
                });
                return () => { if(chartInstance.current) chartInstance.current.destroy(); };
            }, [points, activeIdx]);
            
            return <canvas ref={chartRef} />;
        };

        // --- ALLOCATION BAR ---
        const AllocationBar = ({ composition }) => {
            const filtered = composition.filter(a => a.w > 0.5).sort((a, b) => b.w - a.w);
            const totalWeight = filtered.reduce((sum, a) => sum + a.w, 0);
            
            return (
                <div className="space-y-4">
                    <div className="flex h-12 rounded-xl overflow-hidden shadow-lg border border-slate-700/30">
                        {filtered.map((asset, i) => {
                            const colors = ASSET_COLORS[asset.t] || { bg: "from-slate-500 to-slate-600" };
                            const widthPercent = (asset.w / totalWeight) * 100;
                            return (
                                <div key={asset.t} className={`bg-gradient-to-b ${colors.bg} flex items-center justify-center relative group transition-all duration-300 hover:brightness-110`} style={{ width: `${widthPercent}%` }}>
                                    {widthPercent > 12 && <span className="text-white font-bold text-sm drop-shadow-lg">{asset.t}</span>}
                                    <div className="absolute bottom-full mb-2 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all duration-200 pointer-events-none z-50">
                                        <div className="bg-slate-900 border border-slate-600/50 rounded-xl px-4 py-3 shadow-2xl whitespace-nowrap">
                                            <div className="text-white font-bold text-sm">{asset.t}</div>
                                            <div className="text-slate-400 text-[10px]">{ASSET_NAMES[asset.t]}</div>
                                            <div className="text-cyan-400 font-mono font-bold text-lg">{asset.w.toFixed(1)}%</div>
                                            <div className="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-slate-900"></div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="flex flex-wrap gap-x-6 gap-y-2 justify-center">
                        {filtered.map((asset) => {
                            const colors = ASSET_COLORS[asset.t] || { dot: "bg-slate-500" };
                            return (
                                <div key={asset.t} className="flex items-center gap-2 text-sm">
                                    <div className={`w-3 h-3 rounded-full ${colors.dot} shadow-lg`}></div>
                                    <span className="text-slate-400 font-medium">{asset.t}</span>
                                    <span className="font-mono text-cyan-400 font-bold">{asset.w.toFixed(1)}%</span>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- METRIC CARD (Enhanced) ---
        const MetricCard = ({ label, value, benchmark, better }) => (
            <div className="glass-card rounded-2xl p-5 relative overflow-hidden group">
                <div className="absolute inset-0 bg-gradient-to-br from-white/[0.02] to-transparent pointer-events-none"></div>
                <div className="relative z-10">
                    <div className="text-[10px] text-slate-500 uppercase font-bold tracking-wider mb-3">{label}</div>
                    <div className={`font-mono font-bold text-2xl mb-3 ${value.includes('-') && label.includes('Drawdown') ? 'text-rose-400' : 'text-white'}`}>
                        {value}
                    </div>
                    {benchmark && (
                        <div className="flex items-center gap-2 pt-2 border-t border-slate-700/50">
                            <div className={`w-1.5 h-1.5 rounded-full ${better ? 'bg-emerald-400' : 'bg-slate-500'}`}></div>
                            <span className="text-[12px] text-slate-500">SPY:</span>
                            <span className={`text-[12px] font-mono font-semibold ${better ? 'text-emerald-400' : 'text-slate-400'}`}>{benchmark}</span>
                        </div>
                    )}
                </div>
            </div>
        );

        // --- PARAMETER BUTTON ---
        const ParamButton = ({ label, active, onClick, color = "cyan" }) => {
            const colorClasses = {
                cyan: active ? 'bg-gradient-to-r from-cyan-600 to-cyan-700 text-white shadow-lg shadow-cyan-500/25' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-700/60 hover:text-white',
                purple: active ? 'bg-gradient-to-r from-purple-600 to-violet-600 text-white shadow-lg shadow-purple-500/25' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-700/60 hover:text-white',
                emerald: active ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-lg shadow-emerald-500/25' : 'bg-slate-800/60 text-slate-400 hover:bg-slate-700/60 hover:text-white'
            };
            return (
                <button onClick={onClick} className={`param-btn py-2.5 px-3 text-xs font-bold rounded-xl transition-all duration-300 ${colorClasses[color]} ${active ? 'active' : ''}`}>
                    {label}
                </button>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [fullData, setFullData] = useState(null);
            const [lookback, setLookback] = useState('1W');
            const [rebalance, setRebalance] = useState('2M');
            const [riskLevel, setRiskLevel] = useState(1);
            const [lastUpdate, setLastUpdate] = useState(null);
            const [mode, setMode] = useState('LOADING');

            const lookbackOptions = [
                { key: '1W', label: '1 Week' },
                { key: '2W', label: '2 Weeks' },
                { key: '1M', label: '1 Month' },
                { key: '2M', label: '2 Months' },
                { key: '3M', label: '3 Months' },
                { key: '6M', label: '6 Months' },
                { key: '9M', label: '9 Months' },
                { key: '12M', label: '12 Months' }
            ];

            const rebalanceOptions = [
                { key: '1W', label: '1 Week' },
                { key: '2W', label: '2 Weeks' },
                { key: '1M', label: '1 Month' },
                { key: '2M', label: '2 Months' },
                { key: '3M', label: '3 Months' },
                { key: '6M', label: '6 Months' },
                { key: '9M', label: '9 Months' },
                { key: '12M', label: '12 Months' }
            ];

            const riskLabels = { 1: "Conservative", 2: "Moderate", 3: "Balanced", 4: "Growth", 5: "Aggressive" };

            useEffect(() => {
                const loadData = async () => {
                    try {
                        const res = await fetch('./frontier_data.json?t=' + Date.now());
                        if (!res.ok) throw new Error("No Data");
                        const json = await res.json();
                        if (!json.datasets) throw new Error("Invalid data");
                        
                        setFullData(json);
                        setLastUpdate(json.last_updated);
                        setMode('REAL');
                        
                        // Set defaults
                        const defaultLookback = json.datasets['1W'] ? '1W' : Object.keys(json.datasets)[0];
                        setLookback(defaultLookback);
                    } catch (err) {
                        console.warn("Data Error:", err);
                        setMode('DEMO'); 
                    }
                };
                loadData();
            }, []);

            // Loading
            if (mode === 'LOADING') return (
                <div className="h-screen w-full flex flex-col justify-center items-center gap-6">
                    <div className="relative">
                        <div className="w-20 h-20 border-4 border-slate-700 rounded-full"></div>
                        <div className="w-20 h-20 border-4 border-cyan-500 border-t-transparent rounded-full animate-spin absolute top-0 left-0"></div>
                    </div>
                    <div className="text-cyan-400 font-mono text-sm tracking-widest animate-pulse">INITIALIZING...</div>
                </div>
            );

            // Error
            if (mode === 'DEMO') return (
                <div className="h-screen w-full flex flex-col justify-center items-center gap-4">
                    <div className="text-6xl mb-4">📊</div>
                    <div className="text-rose-400 font-bold text-xl">Data Not Available</div>
                    <div className="text-slate-500 text-sm">Run optimizer_v2.py to generate frontier_data.json</div>
                </div>
            );

            // Get data for current selection
            const lookbackData = fullData.datasets[lookback];
            const rebalanceData = lookbackData?.rebalance?.[rebalance];
            const scenario = rebalanceData?.[riskLevel.toString()];
            const benchmark = fullData.benchmark;
            
            if (!lookbackData || !scenario) {
                return (
                    <div className="h-screen w-full flex flex-col justify-center items-center gap-4">
                        <div className="text-amber-400 font-bold">No data for selected parameters</div>
                        <div className="text-slate-500 text-sm">Lookback: {lookback}, Rebalance: {rebalance}, Risk: {riskLevel}</div>
                        <button onClick={() => { setLookback('2W'); setRebalance('2M'); setRiskLevel(2); }} 
                            className="px-6 py-3 bg-cyan-600 rounded-xl text-white font-semibold hover:bg-cyan-500 transition-colors">Reset</button>
                    </div>
                );
            }

            // Calculate metrics
            const curveStart = scenario.curve[0] || 100;
            const curveEnd = scenario.curve[scenario.curve.length - 1] || 100;
            const totalReturn = ((curveEnd - curveStart) / curveStart * 100).toFixed(2);

            return (
                <div className="max-w-7xl mx-auto px-4 md:px-8 py-8 space-y-8">
                    
                    {/* === HEADER === */}
                    <header className="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 pb-6 border-b border-slate-800/50">
                        <div>
                            <div className="flex items-center gap-4 mb-2">
                                <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight">
                                    <span className="text-white">ETF</span>
                                    <span className="gradient-text ml-2">OPTIMIZER</span>
                                </h1>
                                <span className="flex items-center gap-2 text-[10px] font-bold px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                    <span className="w-2 h-2 rounded-full bg-emerald-500 pulse-dot"></span>LIVE
                                </span>
                            </div>
                            <p className="text-slate-500 text-sm">Mean-Variance Portfolio Optimization • Updated {lastUpdate}</p>
                        </div>
                    </header>

                    {/* === INPUT PARAMETERS === */}
                    <section className="glass rounded-3xl p-6 md:p-8">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-purple-500/20 flex items-center justify-center">
                                <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
                                </svg>
                            </div>
                            <h2 className="text-lg font-bold text-white">Optimization Parameters</h2>
                            <div className="ml-auto text-[10px] text-slate-500 font-mono bg-slate-800/50 px-3 py-1 rounded-full">
                                320 Combinations Available
                            </div>
                        </div>
                        
                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                            {/* Lookback Period */}
                            <div className="bg-slate-900/40 rounded-2xl p-5 border border-slate-700/30">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full bg-purple-500"></div>
                                        <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Lookback Period</span>
                                    </div>
                                    <span className="text-[10px] font-bold px-2 py-1 rounded-lg bg-purple-500/20 text-purple-300">{lookbackOptions.find(o => o.key === lookback)?.label}</span>
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    {lookbackOptions.map(opt => (
                                        <ParamButton key={opt.key} label={opt.key} active={lookback === opt.key} onClick={() => setLookback(opt.key)} color="purple" />
                                    ))}
                                </div>
                                <p className="text-[10px] text-slate-600 mt-3">Historical window for covariance estimation</p>
                            </div>

                            {/* Rebalance Period */}
                            <div className="bg-slate-900/40 rounded-2xl p-5 border border-slate-700/30">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full bg-emerald-500"></div>
                                        <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rebalance Period</span>
                                    </div>
                                    <span className="text-[10px] font-bold px-2 py-1 rounded-lg bg-emerald-500/20 text-emerald-300">{rebalanceOptions.find(o => o.key === rebalance)?.label}</span>
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    {rebalanceOptions.map(opt => (
                                        <ParamButton key={opt.key} label={opt.key} active={rebalance === opt.key} onClick={() => setRebalance(opt.key)} color="emerald" />
                                    ))}

                                <p className="text-[10px] text-slate-600 mt-3">Portfolio weight adjustment frequency</p>
                            </div>

                            {/* Risk Profile */}
                            <div className="bg-slate-900/40 rounded-2xl p-5 border border-slate-700/30">
                                <div className="flex items-center justify-between mb-4">
                                    <div className="flex items-center gap-2">
                                        <div className="w-2 h-2 rounded-full bg-cyan-500"></div>

                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                                </svg>
                            </div>
                            <h2 className="text-lg font-bold text-white">3-Year Backtest Results</h2>
                        </div>

                                        <span className="text-[11px] font-mono font-semibold text-cyan-400">{curveEnd.toFixed(1)}</span>
                                    </div>
                                </div>
                            </div>
                            <MetricCard 
                                label="Yearly Return Avg" 
                                value={scenario.stats.annual} 
                                benchmark={benchmark.stats.annual}
                                better={parseFloat(scenario.stats.annual) > parseFloat(benchmark.stats.annual)}
                            />
                            <MetricCard 
                                label="Monthly Return Avg" 
                                value={scenario.stats.monthly} 
                                benchmark={benchmark.stats.monthly}
                                better={parseFloat(scenario.stats.monthly) > parseFloat(benchmark.stats.monthly)}
                            />
                            <MetricCard 
                                label="Sharpe Ratio" 
                                value={scenario.stats.sharpe} 
                                benchmark={benchmark.stats.sharpe}
                                better={parseFloat(scenario.stats.sharpe) > parseFloat(benchmark.stats.sharpe)}
                            />
                            <MetricCard 
                                label="Max Drawdown" 
                                value={`-${scenario.stats.dd}`} 
                                benchmark={`-${benchmark.stats.dd}`}
                                better={parseFloat(scenario.stats.dd) < parseFloat(benchmark.stats.dd)}
                            />
                        </div>
                    </section>

                    {/* === ALLOCATION === */}
                    <section className="glass rounded-3xl p-6 md:p-8">
                        <div className="flex items-center justify-between mb-6">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500/20 to-orange-500/20 flex items-center justify-center">
                                    <svg className="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"/>
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"/>
                                    </svg>
                                </div>
                                <h2 className="text-lg font-bold text-white">Current Allocation</h2>
                            </div>
                            <span className="text-xs text-slate-500 font-mono bg-slate-800/50 px-3 py-1 rounded-full">
                                {lookbackOptions.find(o => o.key === lookback)?.label} lookback
                            </span>
                        </div>
                        <AllocationBar composition={scenario.composition} />
                    </section>

                    {/* === CHARTS === */}
                    <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
                        <section className="glass rounded-3xl p-6 md:p-8">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500/20 to-blue-500/20 flex items-center justify-center">
                                    <svg className="w-5 h-5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                                </div>
                                <h2 className="text-lg font-bold text-white">Historical Performance</h2>
                            </div>
                            <div className="flex items-center gap-6 mb-4 text-xs">
                                <div className="flex items-center gap-2"><div className="w-6 h-0.5 bg-cyan-400 rounded"></div><span className="text-slate-400">Portfolio</span></div>
                                <div className="flex items-center gap-2"><div className="w-6 h-0.5 bg-slate-500 rounded opacity-60"></div><span className="text-slate-400">S&P 500</span></div>
                            </div>
                            <div className="h-[320px]">
                                <BacktestChart chartData={scenario.curve} benchmarkData={benchmark.curve} dates={benchmark.dates} historyWeights={scenario.history_weights} />
                            </div>
                        </section>

                        <section className="glass rounded-3xl p-6 md:p-8">
                            <div className="flex items-center gap-3 mb-2">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-purple-500/20 to-pink-500/20 flex items-center justify-center">
                                    <svg className="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" strokeWidth="2"/><path d="M8 12h8M12 8v8" strokeWidth="2" strokeLinecap="round"/></svg>
                                </div>
                                <h2 className="text-lg font-bold text-white">Efficient Frontier</h2>
                            </div>
                            <div className="text-xs text-slate-500 mb-4">Selected: <span className="text-cyan-400 font-semibold">{riskLabels[riskLevel]}</span> profile</div>
                            <div className="h-[320px]">
                                <FrontierChart points={lookbackData.frontier?.points || []} activeIdx={riskLevel} />
                            </div>
                        </section>
                    </div>

                    {/* === METHODOLOGY === */}
                    <section className="glass rounded-3xl p-6 md:p-8">
                        <div className="flex items-center gap-3 mb-6">
                            <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-slate-500/20 to-slate-600/20 flex items-center justify-center">
                                <svg className="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            </div>
                            <h2 className="text-lg font-bold text-white">Methodology</h2>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                            <div className="bg-slate-900/40 rounded-2xl p-6 border border-slate-700/30">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-8 h-8 rounded-lg bg-cyan-500/20 flex items-center justify-center">
                                        <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                                    </div>
                                    <h3 className="text-sm font-bold text-white uppercase tracking-wider">The Model: Markowitz MPT</h3>
                                </div>
                                <p className="text-slate-400 text-sm leading-relaxed">The "Efficient Frontier" represents the set of optimal portfolios offering the highest expected return for a defined level of risk.</p>
                            </div>
                            <div className="bg-slate-900/40 rounded-2xl p-6 border border-slate-700/30">
                                <div className="flex items-center gap-3 mb-4">
                                    <div className="w-8 h-8 rounded-lg bg-emerald-500/20 flex items-center justify-center">
                                        <svg className="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"/></svg>
                                    </div>
                                    <h3 className="text-sm font-bold text-white uppercase tracking-wider">Method: Quadratic Optimization</h3>
                                </div>
                                <p className="text-slate-400 text-sm leading-relaxed">We calculate the <span className="text-white font-semibold">Covariance Matrix (Σ)</span> of 20 global factors. The solver executes a quadratic programming routine to find weight vectors (<span className="text-white font-semibold">w</span>) that maximize the portfolio's risk-adjusted return (Utility).</p>
                            </div>
                        </div>

                        <div className="bg-slate-900/40 rounded-2xl p-6 border border-slate-700/30">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="w-8 h-8 rounded-lg bg-purple-500/20 flex items-center justify-center">
                                    <svg className="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                </div>
                                <h3 className="text-sm font-bold text-white uppercase tracking-wider">Strategic Asset Universe (20 ETFs)</h3>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {/* Core Equities */}
                                <div>
                                    <h4 className="text-cyan-400 font-bold text-xs uppercase tracking-wider mb-3 pb-2 border-b border-slate-700/50">Core Equities</h4>
                                    <div className="space-y-2 text-sm">
                                        <div><span className="text-white font-semibold">SPY:</span> <span className="text-slate-400">S&P 500 Large Cap</span></div>
                                        <div><span className="text-white font-semibold">QQQ:</span> <span className="text-slate-400">Nasdaq-100 Tech</span></div>
                                        <div><span className="text-white font-semibold">IWM:</span> <span className="text-slate-400">Russell 2000 Small Cap</span></div>
                                        <div><span className="text-white font-semibold">VGK:</span> <span className="text-slate-400">Europe Developed</span></div>
                                        <div><span className="text-white font-semibold">EEM:</span> <span className="text-slate-400">Emerging Markets</span></div>
                                    </div>

                                    <h4 className="text-fuchsia-400 font-bold text-xs uppercase tracking-wider mb-3 pb-2 border-b border-slate-700/50">Sector & Thematic</h4>
                                    <div className="space-y-2 text-sm">
                                        <div><span className="text-white font-semibold">SMH:</span> <span className="text-slate-400">Semiconductors</span></div>
                                        <div><span className="text-white font-semibold">XLE:</span> <span className="text-slate-400">Energy Sector</span></div>
                                    </div>
                                </div>
                                {/* Fixed Income */}
                                <div>
                                    <h4 className="text-emerald-400 font-bold text-xs uppercase tracking-wider mb-3 pb-2 border-b border-slate-700/50">Fixed Income</h4>
                                    <div className="space-y-2 text-sm">
                                        <div><span className="text-white font-semibold">TLT:</span> <span className="text-slate-400">Treasury 20Y+ Bonds</span></div>
                                        <div><span className="text-white font-semibold">LQD:</span> <span className="text-slate-400">Investment Grade Corp</span></div>

                                        <div><span className="text-white font-semibold">ETHA:</span> <span className="text-slate-400">Ethereum ETF</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* === FOOTER === */}
                    <footer className="text-center py-6 border-t border-slate-800/50">
                        <p className="text-[11px] text-slate-600 font-mono">Past performance is not indicative of future results</p>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
